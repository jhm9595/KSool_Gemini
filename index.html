<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>K-술</title>
  <!-- 모듈형 스타일시트 -->
  <link rel="stylesheet" href="./src/css/variables.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/layout.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/brew.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/pickers/picker_common.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/hint_center.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/fridge_recommender.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/suggestion_board.css?v=20261101_2">
  <link rel="stylesheet" href="./src/css/party_games.css?v=20261101_2">
</head>
<body>

<div id="app-container">
  <!-- 상단 헤더 & 설정 툴바 -->
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="k-emblem" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="4" width="34" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
            <!-- 건곤감리 4괘 -->
            <g stroke="#0F172A" stroke-width="1.6" stroke-linecap="round">
              <line x1="6" y1="11" x2="10" y2="7"/><line x1="7.5" y1="12.5" x2="11.5" y2="8.5"/>
              <line x1="26" y1="7" x2="30" y2="11"/><line x1="24.5" y1="8.5" x2="28.5" y2="12.5"/>
              <line x1="6" y1="25" x2="10" y2="29"/><line x1="7.5" y1="23.5" x2="11.5" y2="27.5"/>
              <line x1="26" y1="29" x2="30" y2="25"/><line x1="24.5" y1="27.5" x2="28.5" y2="23.5"/>
            </g>
            <!-- 중앙 태극 문양 -->
            <circle cx="18" cy="18" r="7.5" fill="#CD2E3A"/>
            <path d="M10.5 18 A7.5 7.5 0 0 0 25.5 18 A3.75 3.75 0 0 1 18 18 A3.75 3.75 0 0 0 10.5 18 Z" fill="#0047A0"/>
            <circle cx="14.25" cy="18" r="3.75" fill="#CD2E3A"/>
            <circle cx="21.75" cy="18" r="3.75" fill="#0047A0"/>
          </svg>
        </span>
        <div class="brand-title-row">
          <h1>K-술</h1>
          <span class="brand-inline-sub">한국의 술자리 연금술</span>
        </div>
      </div>
    </div>

    <div class="header-toolbar">
      <button id="toggle-slots-btn" class="toolbar-toggle" title="초안 4슬롯 <-> 무제한 확장 전환">📦 슬롯:4칸</button>
      <button id="toggle-license-btn" class="toolbar-toggle" title="패러디 가짜명 <-> 제휴 실제명 전환">🎭 패러디명</button>
      <button id="toggle-sandbox-btn" class="toolbar-toggle" title="연쇄 해금 <-> 전체 재료 열기">🌱 연쇄해금</button>
      <button id="reset-progress-btn" class="toolbar-toggle" title="해금 기록 초기화">🔄 초기화</button>
    </div>
  </header>

  <!-- [탭 1] 주조실 (Crafting View) -->
  <section id="view-brew" class="view active">
    <div class="pot-section">
      <!-- 단계별 넘버링 퀴즈 모드 & 자유 주조 모드 전환 패널 -->
      <div id="brew-step-quiz-bar" class="brew-step-quiz-bar"></div>

      <!-- 동적 조합 슬롯 (초안 4칸, 무제한 확장 가능) -->
      <div id="pot-slots-grid" class="pot-slots-grid"></div>

      <!-- 기 주조 레시피 실시간 감지 알림 바 -->
      <div id="pot-match-notice" class="pot-match-notice"></div>

      <div class="pot-actions">
        <button id="mix-btn" class="mix-btn" disabled>⚗️ 조합하기</button>
        <button id="clear-pot-btn" class="clear-pot-btn">비우기</button>
      </div>
    </div>

    <!-- 대표 재료 인벤토리 (클릭 시 팔도 지도 / 소주 냉장고 등 전용 모달 연동) -->
    <div class="inventory-section">
      <div id="ing-cat-bar" class="cat-filter-bar"></div>
      <div id="ingredients-grid" class="ingredients-grid"></div>
    </div>
  </section>

  <!-- [탭 2] 도감 & 3대 힌트 센터 진입 뷰 -->
  <section id="view-collection" class="view">
    <div class="collection-header">
      <div class="collection-top-row">
        <div id="recipe-cat-bar" class="cat-filter-bar"></div>
        <div class="progress-pill collection-progress-pill">
          도감 <span id="unlocked-count">0 / 56</span>
        </div>
      </div>
    </div>
    <div id="sool-grid" class="sool-grid"></div>
  </section>

  <!-- [탭 3] 내 냉장고 술 조합 추천기 & 랜덤 고르기 뷰 -->
  <section id="view-fridge" class="view"></section>

  <!-- [탭 4] 초간단 조합 추천 & 관리자 '딸깍' 뷰 -->
  <section id="view-suggestions" class="view"></section>

  <!-- [탭 5] 오프라인 술자리 패스앤플레이 미니게임 뷰 -->
  <section id="view-party" class="view"></section>

  <!-- 모바일 하단 메인 탭 네비게이션 (Bottom Bar) -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab-target="brew">
      <span style="font-size:1.15rem;">⚗️</span>
      <span>주조실</span>
    </button>
    <button class="tab-btn" data-tab-target="collection">
      <span style="font-size:1.15rem;">📜</span>
      <span>도감·힌트</span>
    </button>
    <button class="tab-btn" data-tab-target="suggestions">
      <span style="font-size:1.15rem;">👍</span>
      <span>추천</span>
    </button>
    <button class="tab-btn" data-tab-target="party">
      <span style="font-size:1.15rem;">🍻</span>
      <span>술게임</span>
    </button>
  </nav>

  <!-- [모달 1] 대표 재료별 전용 상세 재료 선택 모달 (팔도 지도 / 소주 쇼케이스 등) -->
  <div id="detail-picker-modal" class="modal-overlay">
    <div id="detail-picker-content" class="modal-card"></div>
  </div>

  <!-- [모달 2] 3대 힌트 센터 모달 (5-1 숫자야구, 5-2 Up/Down, 5-3 유튜브/블로그 링크) -->
  <div id="hint-modal" class="modal-overlay">
    <div id="hint-modal-content" class="modal-card"></div>
  </div>

  <!-- [모달 3] 조합 결과 및 레시피 상세 모달 -->
  <div id="result-modal" class="modal-overlay">
    <div id="result-modal-content" class="modal-card"></div>
  </div>

  <!-- [모달 4] 신규 탭 점진 해금 안내 모달 (최초 1회 노출) -->
  <div id="tab-intro-modal" class="modal-overlay">
    <div id="tab-intro-content" class="modal-card"></div>
  </div>
</div>

<!-- OOP 모듈 로드 (오프라인/로컬 file:// 및 웹서버 100% 호환) -->
<script src="./src/js/config/SeedDataBundle.js"></script>
<script src="./src/js/services/PixelIconRegistry.js"></script>
<script src="./src/js/config/GameConfig.js"></script>
<script src="./src/js/services/BrandResolver.js"></script>
<script src="./src/js/services/StorageService.js"></script>
<script src="./src/js/core/CraftingPot.js"></script>
<script src="./src/js/core/ProgressionEngine.js"></script>
<script src="./src/js/core/RecipeBook.js"></script>
<script src="./src/js/core/InventoryManager.js"></script>
<script src="./src/js/core/hint/FeedbackHintStrategy.js"></script>
<script src="./src/js/core/hint/BaseballHintEngine.js"></script>
<script src="./src/js/core/hint/RatioHintProvider.js"></script>
<script src="./src/js/core/hint/ImageMinigameSuite.js"></script>
<script src="./src/js/core/fridge/FridgeMatcherEngine.js"></script>
<script src="./src/js/core/suggestion/SuggestionService.js"></script>
<script src="./src/js/core/AlchemyEngine.js"></script>
<script src="./src/js/ui/pickers/DetailPickerRegistry.js"></script>
<script src="./src/js/ui/HintModalView.js"></script>
<script src="./src/js/ui/FridgeRecommenderView.js"></script>
<script src="./src/js/ui/SuggestionBoardView.js"></script>
<script src="./src/js/ui/party/PartySoundSynth.js"></script>
<script src="./src/js/ui/party/games/UpAndDownGame.js"></script>
<script src="./src/js/ui/party/games/CapFlickGame.js"></script>
<script src="./src/js/ui/party/games/SurfaceTensionGame.js"></script>
<script src="./src/js/ui/party/games/BottleSpinGame.js"></script>
<script src="./src/js/ui/party/games/HunminBombGame.js"></script>
<script src="./src/js/ui/party/games/PenaltyCocktailGame.js"></script>
<script src="./src/js/ui/party/games/FridgePartyGame.js"></script>
<script src="./src/js/ui/party/PartyGameHubView.js"></script>
<script src="./src/js/app.js"></script>
</body>
</html>
